# Copy to values-halden.yaml and replace every CHANGE_ME / example host.
# Chart helper is: {{ global.registry }}/{{ image }}:{{ tag }}
# Preflight (TARGET=byoc) checks REGISTRY_HOST/{cap-web,media-server,mysql,minio,minio-mc}.
# Keep image names FLAT (not cap/cap-web) so Helm matches imported tags.
#
# Also add this registry prefix to Kyverno halden-private-registry-only
# before applying policies (do not leave only localhost:5001 / vendor Hub).

global:
  registry: registry.halden.pharma/cap  # REQUIRED — same as REGISTRY_HOST
  imagePullPolicy: IfNotPresent
  # imagePullSecrets:
  #   - name: halden-registry-creds

capWeb:
  image: cap-web
  tag: latest

mediaServer:
  image: media-server
  tag: latest

mysql:
  image: mysql
  tag: "8.0"

minio:
  image: minio
  tag: latest
  mcImage: minio-mc
  mcTag: latest

# REQUIRED — DNS/TLS users and the desktop app will use
publicUrl: https://cap.halden.pharma
s3PublicUrl: https://s3.cap.halden.pharma

ingress:
  enabled: true
  className: nginx          # REQUIRED if ingress.enabled — your IngressClass
  host: cap.halden.pharma   # must match publicUrl host
  s3Host: s3.cap.halden.pharma

# REQUIRED in production — replace all placeholders; never ship chart defaults
secrets:
  mysqlPassword: CHANGE_ME
  mysqlRootPassword: CHANGE_ME
  minioRootUser: CHANGE_ME
  minioRootPassword: CHANGE_ME
  databaseEncryptionKey: "64_HEX_CHARS________________________________________________"
  nextauthSecret: "64_HEX_CHARS________________________________________________"
  mediaServerWebhookSecret: "64_HEX_CHARS________________________________________________"

networkPolicy:
  enabled: true
  allowExternalIngress: false  # true only if using NodePort without ingress
