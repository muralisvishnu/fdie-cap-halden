# GKE / customer cloud — Tier 1: vendor-qualified build, import to global.registry.
# Vendor runs make mirror + mirror-to-registry; customer imports pinned digests (see docs/image-supply-model.md).
global:
  registry: docker.io/muralisvishnu
  imagePullPolicy: IfNotPresent

capWeb:
  image: cap-web
  tag: latest

mediaServer:
  image: media-server
  tag: latest

mysql:
  image: mysql
  tag: "8.0"

minio:
  image: minio
  tag: latest
  mcImage: minio-mc
  mcTag: latest
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  catchAll: false
  host: cap.halden.example.com
  s3Host: s3.halden.example.com

publicUrl: https://cap.halden.example.com
s3PublicUrl: https://s3.halden.example.com

networkPolicy:
  enabled: true
  allowExternalIngress: false
