apiVersion: v1
kind: Service
metadata:
  name: media-server
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: cap-media-server
  ports:
    - port: {{ .Values.mediaServer.port }}
      targetPort: {{ .Values.mediaServer.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-media-server
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cap-media-server
  template:
    metadata:
      labels:
        app: cap-media-server
        halden.cap/component: media-server
    spec:
      {{- include "cap.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-server
          image: {{ include "cap.image" (dict "Values" .Values "image" .Values.mediaServer.image "tag" .Values.mediaServer.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.mediaServer.port }}
          env:
            - name: PORT
              value: {{ .Values.mediaServer.port | quote }}
            - name: MEDIA_SERVER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MEDIA_SERVER_WEBHOOK_SECRET
          resources:
            {{- toYaml .Values.mediaServer.resources | nindent 12 }}
          securityContext:
            {{- include "cap.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - bun
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.mediaServer.port }}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - bun
                - -e
                - "fetch('http://127.0.0.1:{{ .Values.mediaServer.port }}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
