apiVersion: v1
kind: Service
metadata:
  name: cap-web
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.capWeb.service.type | default "ClusterIP" }}
  selector:
    app: cap-web
  ports:
    - port: {{ .Values.capWeb.port }}
      targetPort: {{ .Values.capWeb.port }}
      {{- if and (eq (.Values.capWeb.service.type | default "ClusterIP") "NodePort") .Values.capWeb.service.nodePort }}
      nodePort: {{ .Values.capWeb.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-web
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cap-web
  template:
    metadata:
      labels:
        app: cap-web
        halden.cap/component: cap-web
    spec:
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-mysql
          image: {{ include "cap.image" (dict "Values" .Values "image" .Values.mysql.image "tag" .Values.mysql.tag) }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mysqladmin ping -h mysql -u{{ .Values.mysql.user }} -p"$MYSQL_PASSWORD" --silent; do
                echo waiting for mysql; sleep 3;
              done
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            {{- include "cap.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: cap-web
          image: {{ include "cap.image" (dict "Values" .Values "image" .Values.capWeb.image "tag" .Values.capWeb.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.capWeb.port }}
          env:
            - name: DATABASE_URL
              value: mysql://{{ .Values.mysql.user }}:{{ .Values.secrets.mysqlPassword }}@mysql:3306/{{ .Values.mysql.database }}
            - name: WEB_URL
              value: {{ .Values.publicUrl | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.publicUrl | quote }}
            - name: DATABASE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: DATABASE_ENCRYPTION_KEY
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: NEXTAUTH_SECRET
            - name: MEDIA_SERVER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MEDIA_SERVER_WEBHOOK_SECRET
            - name: CAP_AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MINIO_ROOT_USER
            - name: CAP_AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: CAP_AWS_BUCKET
              value: {{ .Values.minio.bucket | quote }}
            - name: CAP_AWS_REGION
              value: us-east-1
            - name: S3_PUBLIC_ENDPOINT
              value: {{ .Values.s3PublicUrl | quote }}
            - name: S3_INTERNAL_ENDPOINT
              value: http://minio:9000
            - name: S3_PATH_STYLE
              value: "true"
            - name: MEDIA_SERVER_URL
              value: http://media-server:{{ .Values.mediaServer.port }}
            - name: MEDIA_SERVER_WEBHOOK_URL
              value: http://cap-web:{{ .Values.capWeb.port }}
            - name: RESEND_API_KEY
              value: ""
            - name: RESEND_FROM_DOMAIN
              value: ""
            - name: HTTP_PROXY
              value: http://egress-proxy.egress-system.svc.cluster.local:3128
            - name: HTTPS_PROXY
              value: http://egress-proxy.egress-system.svc.cluster.local:3128
            - name: NO_PROXY
              value: "localhost,127.0.0.1,.svc,.cluster.local,mysql,minio,media-server,cap-web"
          resources:
            {{- toYaml .Values.capWeb.resources | nindent 12 }}
          securityContext:
            {{- include "cap.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -qO- --timeout=3 http://127.0.0.1:{{ .Values.capWeb.port }}/login >/dev/null
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget -qO- --timeout=3 http://127.0.0.1:{{ .Values.capWeb.port }}/login >/dev/null
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
