apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.minio.service.type | default "ClusterIP" }}
  selector:
    app: cap-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      {{- if and (eq (.Values.minio.service.type | default "ClusterIP") "NodePort") .Values.minio.service.nodePort }}
      nodePort: {{ .Values.minio.service.nodePort }}
      {{- end }}
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cap-minio
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: cap-minio
  template:
    metadata:
      labels:
        app: cap-minio
        halden.cap/component: minio
    spec:
      {{- include "cap.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: {{ include "cap.image" (dict "Values" .Values "image" .Values.minio.image "tag" .Values.minio.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MINIO_ROOT_PASSWORD
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          securityContext:
            {{- include "cap.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cap-minio-setup
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: cap-minio-setup
        halden.cap/component: minio-setup
    spec:
      {{- include "cap.imagePullSecrets" . | nindent 6 }}
      restartPolicy: OnFailure
      volumes:
        - name: mc-config
          emptyDir: {}
      containers:
        - name: mc
          image: {{ include "cap.image" (dict "Values" .Values "image" .Values.minio.mcImage "tag" .Values.minio.mcTag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cap-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /tmp/.mc
              mc --config-dir /tmp/.mc alias set capminio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc --config-dir /tmp/.mc mb capminio/{{ .Values.minio.bucket }} --ignore-existing
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: mc-config
              mountPath: /tmp/.mc
