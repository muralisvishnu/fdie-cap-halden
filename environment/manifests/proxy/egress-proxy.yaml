apiVersion: v1
kind: Namespace
metadata:
  name: egress-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-proxy-config
  namespace: egress-system
data:
  squid.conf: |
    http_port 3128
    acl SSL_ports port 443
    acl Safe_ports port 80 443 1025-65535
    acl CONNECT method CONNECT
    acl allowed_domains dstdomain .svc.cluster.local
    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports
    http_access allow allowed_domains
    http_access deny all
    access_log stdio:/dev/stdout
    cache_log stdio:/dev/stderr
    cache deny all
    dns_v4_first on
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-proxy
  namespace: egress-system
  labels:
    app: egress-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress-proxy
  template:
    metadata:
      labels:
        app: egress-proxy
    spec:
      containers:
        - name: squid
          image: ubuntu/squid:5.2-22.04_beta
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3128
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
      volumes:
        - name: config
          configMap:
            name: egress-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: egress-proxy
  namespace: egress-system
spec:
  selector:
    app: egress-proxy
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
