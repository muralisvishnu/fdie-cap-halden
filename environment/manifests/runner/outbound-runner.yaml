apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbound-runner
  namespace: cap
  labels:
    app: outbound-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbound-runner
  template:
    metadata:
      labels:
        app: outbound-runner
        halden.cap/component: outbound-runner
    spec:
      serviceAccountName: deployer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: localhost:5001/cap/minio-mc:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Outbound-only runner: polls registry, no inbound listeners"
              while true; do
                wget -q -O /dev/null http://cage-registry.cage-system.svc.cluster.local:5000/v2/ || echo "registry poll failed"
                sleep 30
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
