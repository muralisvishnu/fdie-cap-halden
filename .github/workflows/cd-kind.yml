name: cd-kind

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  deploy-upgrade-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cap source checkout
        uses: actions/cache@v4
        with:
          path: .build/cap-src
          key: cap-src-${{ hashFiles('supply-chain/docker/Dockerfile.cap-web.bootstrap') }}-main

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: kind deploy + helm upgrade smoke test
        env:
          CI_KIND: "1"
          ALLOW_NON_THURSDAY: "1"
          REGISTRY_HOST: localhost:5001
          REGISTRY_INCLUSTER: localhost:5001
        run: bash scripts/ci-kind-deploy.sh
