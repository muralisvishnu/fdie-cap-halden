name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Package BYOC bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_VERSION="${VERSION}" bash supply-chain/package-release.sh
          bash scripts/verify-proof.sh || true

      - name: Upload release bundle
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/halden-cap-bundle-*.tar.gz
            dist/halden-cap-bundle-*.tar.gz.sha256
          generate_release_notes: true
